<!DOCTYPE html>
<html lang="th" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop Board</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
  <style>
    body { background: #0a0a0a; color: #fff; }
    .btn { @apply rounded-2xl px-6 py-3 font-semibold transition-all duration-200 active:scale-95; }
  </style>
</head>
<body class="min-h-screen">
  <nav class="p-4 flex justify-between items-center border-b border-zinc-800">
    <h1 class="text-2xl font-bold tracking-tight">ShopBoard</h1>
    <div class="space-x-3">
      <a href="/login" class="btn bg-zinc-800 hover:bg-zinc-700">Login</a>
      <a href="/register" class="btn bg-white text-black hover:bg-zinc-200">Register</a>
    </div>
  </nav>
  <main class="max-w-5xl mx-auto p-6">
    <div class="text-center py-20">
      <h2 class="text-5xl font-black mb-4">ร้านค้าบน Discord<br>ที่ควบคุมได้ทั้งหมด</h2>
      <p class="text-zinc-400 text-lg mb-8">สร้างบอร์ด, จัดการสินค้า, เติมเงิน, เช่าแพ็กเกจ — ทั้งหมดผ่านเว็บและบอท</p>
      <a href="/dashboard" class="btn bg-gradient-to-r from-violet-600 to-fuchsia-600 text-lg">เข้าสู่แดชบอร์ด</a>
    </div>
  </main>
</body>
</html>
